<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>音浪 — 艺人数据看板</title><link rel="stylesheet" href="style.css"></head>
<body><header><a class="brand" href="#">音浪<span>•</span>增长站</a><span class="header-note">ARTIST INTELLIGENCE</span><button id="manage">数据来源 ↗</button></header>
<div class="layout"><aside><div class="aside-title"><h2>我的艺人</h2><span id="count"></span></div><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索已添加的艺人" aria-label="搜索已添加的艺人"></label><button class="add" id="add">＋ 添加艺人</button><div id="artists"></div><p class="aside-note">自由添加，持续关注。<br>艺人列表保存在当前浏览器。</p></aside>
<main><div class="eyebrow">YOUR MUSIC, IN PERSPECTIVE</div><section class="hero"><div class="artist-heading"><div id="hero-photo"></div><div><h1 id="artist-title"></h1><p id="artist-sub"></p><small id="photo-note"></small></div></div><div class="hero-actions"><span class="badge" id="connection">艺人看板</span><button id="refresh-public">更新数据</button><button id="show-sources">查看来源</button><button id="delete-artist" class="danger">删除艺人</button></div></section>
<nav aria-label="看板栏目"><button class="active" data-view="overview">数据总览</button><button data-view="songs">近期作品</button><button data-view="audience">听众画像</button><button data-view="events">近期活动</button><button data-view="sources">数据来源</button></nav>
<div class="notice" id="notice"></div><section id="overview" class="panel"><div class="section-heading"><h2>关键指标</h2><span>音乐消费与榜单表现</span></div><div id="metrics" class="metrics"></div><div id="overview-events"></div><div id="music-platforms" class="music-platforms"></div><div class="lower-grid"><article class="box accent" id="latest-release"></article></div></section>
<section id="songs" class="panel" hidden><div class="section-heading"><h2>近期作品</h2><span>按发行日期排列 · 已核对作品</span></div><div class="box" id="song-content"></div></section>
<section id="audience" class="panel" hidden><div id="audience-content"></div></section>
<section id="events" class="panel" hidden><div class="section-heading"><h2>近期活动</h2><span>已官宣 · 待官宣 · 已结束</span></div><div id="event-content" class="event-grid"></div></section>
<section id="sources" class="panel" hidden><div class="section-heading"><h2>数据来源</h2><span>平台主页与作品页面</span></div><div class="box" id="source-content"></div></section>
<footer><span>YINLANG / ARTIST DASHBOARD</span><span id="save-status">MUSIC / AUDIENCE / INSIGHTS</span></footer></main></div>
<dialog id="artist-dialog"><form id="artist-form"><div class="dialog-head"><h2>添加艺人</h2><button type="button" data-close="artist-dialog" aria-label="关闭">×</button></div><p>输入名字即可添加，也可以附上艺人本人主页。</p><label>艺人名称<input name="name" id="artist-query" required maxlength="100" placeholder="例如：陈奕迅"></label><label>本人微博 / 新浪主页（可选）<input name="publicUrl" type="url" placeholder="https://weibo.com/u/数字ID"></label><button class="primary" type="submit">加入艺人列表</button></form></dialog>
<dialog id="delete-dialog"><div class="dialog-head"><h2>删除艺人</h2><button data-close="delete-dialog" aria-label="关闭">×</button></div><p id="delete-copy"></p><div class="dialog-actions"><button data-close="delete-dialog">取消</button><button class="primary" id="confirm-delete">确认删除</button></div></dialog>
<div id="toast" role="status" aria-live="polite"></div><script src="data.js"></script><script src="public-data.js"></script><script src="music-data.js"></script><script src="app.js"></script></body></html>
